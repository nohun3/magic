# PC-side runtime configuration.
#
# Nothing in pc/capture, pc/detector, pc/condition, etc. should hardcode
# values that belong here (ROI coordinates, thresholds, capture region...).
# Edit this file (or swap in a different settings file) instead of editing code.

capture:
  # If set, capture the client area (no title bar/border) of the first
  # visible window whose title contains this text (case-insensitive).
  # The window's position/size can differ between runs -- it's located
  # once when capture starts, so this works regardless of where the
  # window ends up on screen. Takes priority over region/monitor below.
  # Set to null to fall back to region/monitor capture instead.
  window_title: "Lineage"

  # mss monitor index, used only when window_title is null.
  # 0 = all monitors combined into one virtual screen, 1 = primary
  # monitor, 2 = second monitor, etc.
  monitor: 1

  # Optional fixed sub-region of the chosen monitor, in monitor-local
  # pixel coordinates. Used only when window_title is null. Leave as
  # `null` to capture the full monitor.
  region:
  # region:
  #   left: 0
  #   top: 0
  #   width: 1280
  #   height: 720

  # Target capture rate for the live preview / main loop.
  target_fps: 30

# HP/MP are detected via a shared anchor -- the dragon skull ornament
# between the two bars, which never changes regardless of HP/MP value --
# instead of matching the whole bar image directly. roi_hp.png/roi_mp.png
# (captured at 100% fill) turned out to be unusable for *locating* the
# bar: match score against a partially-filled or near-empty bar drops
# low enough (simulated as low as ~0.33 at 1% fill) to fail even a
# generous threshold, exactly when a low-HP/MP reading matters most.
# roi_hpmp_anchor.png's pixels never change no matter what HP/MP
# currently is (measured 1.0 match score at every fill level tested), so
# anchoring on it and reading each bar via a fixed offset is
# fill-percentage-proof by construction. See pc/detector/README.md and
# anchored_gauge_detector.py.
#
# match_threshold here only has to distinguish "the skull is on screen"
# from "it isn't" -- 0.9 is comfortably strict since the anchor itself
# is 100% static.
roi_hpmp_anchor:
  template: templates/roi_hpmp_anchor.png
  match_threshold: 0.9

# hp/mp's OCR-able text region, as a fixed pixel offset from
# roi_hpmp_anchor's top-left corner (negative left = to the anchor's left,
# i.e. HP; positive = to its right, i.e. MP). Measured directly from a
# live frame -- see pc/detector/README.md if these ever need re-measuring.
hp:
  # Tight numeric-text ROI: excludes most of the animated bar and ornaments.
  content_offset: {left: -137, top: 20, width: 125, height: 31}

mp:
  content_offset: {left: 113, top: 20, width: 135, height: 31}

# Chat log area -- read to find the dungeon-entry remaining-time
# message (see pc/detector/chat_reader.py). Unlike hp/mp/icons, the
# chat log's actual text content keeps changing (scrolling messages),
# so a template captured from one moment won't pixel-match a later
# frame's different text anywhere near as tightly -- match_threshold is
# deliberately much lower here because this template match is only
# locating the panel's stable position/structure, not verifying its
# (constantly changing) content.
chat:
  template: templates/roi_chatting.png
  match_threshold: 0.5

# Skill/quick-slot panel -- icon presence checks (below) are scoped to
# search only inside this region instead of the whole captured frame.
# Faster, and rules out a false match to something elsewhere on screen
# that happens to look similar. Only located ONCE and cached from then
# on (see skill_panel.py's locate()), same as roi_buff -- so, like
# roi_buff, match_threshold only has to be low enough that the one-time
# startup location attempt succeeds, not tight enough for an ongoing
# per-frame check.
#
# Threshold dropped from an earlier 0.7 to 0.4 after several stackable
# quick-slot items (mount-summon count, teleport scroll count) turned
# out to render their remaining-count digits baked directly into the
# icon, right inside this panel's captured area -- so as those counts
# change during normal play, the whole-panel match score drifts with
# them (measured as low as 0.44-0.49 live, well under the old 0.7)
# even though the panel itself hasn't moved at all. Measured a 0.2+
# safety margin at 0.4: true location scored 0.44-1.0 across several
# live counts, a wrong location topped out at 0.285 on the same frame.
# (Also cropped the worst-offending icon templates --
# icon_teleport_scroll.png / icon_teleport_scroll_active.png -- to
# exclude the count-digit corner entirely, so per-icon presence checks
# aren't affected by this either.)
roi_skill:
  template: templates/roi_skill.png
  match_threshold: 0.4
  # The quick-slot panel is fixed at the bottom-right. Restricting the
  # search prevents low-threshold whole-panel matching from accepting a
  # similarly textured patch in the game world.
  search_region: {left: 0.70, top: 0.65, right: 1.0, bottom: 1.0}

# Active-buff column (top-right of screen). Its content changes a lot
# (whatever buffs happen to be active), so unlike hp/mp/roi_skill its
# match score isn't reliable as an ongoing check -- measured as low as
# 0.397 in one buff state and a "wrong location" scoring 0.385 in
# another, uncomfortably close. It's only located ONCE, at startup
# ("remembered"), and that cached position is trusted from then on
# without re-verifying -- see skill_panel.py's locate() (same class
# roi_skill uses). match_threshold only needs to be low enough that the
# one-time startup location attempt succeeds in a typical buff state.
roi_buff:
  template: templates/roi_buff.png
  match_threshold: 0.35

# Buff presence checks, scoped to roi_buff above -- same mechanism as
# icons (see below), just semantically "is this buff currently active"
# instead of "is this item/toggle icon showing".
buffs:
  meditation:
    template: templates/buff_meditation.png
    match_threshold: 0.85
  event:
    template: templates/buff_event.png
    match_threshold: 0.85
  haste:
    template: templates/buff_haste.png
    match_threshold: 0.85  # placeholder, same default as the other buffs -- not yet live-calibrated
  mana:
    template: templates/buff_mana.png
    match_threshold: 0.85

# Icon presence checks: does a specific icon currently appear on
# screen? Unlike hp/mp (always expected to be visible -- not finding
# them is an error), an icon being absent is often a valid, meaningful
# reading on its own (an item not in inventory, a buff not active,
# a toggle that's off) -- see pc/detector/presence_detector.py.
# Searched only within the roi_skill panel above, not the whole frame.
icons:
  hotel_key:
    templates:
    - templates/icon_hotel_key.png
    - templates/icon_hotel_key_active.png
    match_threshold: 0.85
  ats_off:
    template: templates/icon_ats_off.png
    match_threshold: 0.85
  ats_on:
    template: templates/icon_ats_on.png
    match_threshold: 0.85
  teleport:
    template: templates/icon_teleport.png
    match_threshold: 0.85
  talking_scroll:
    # The mouth animates open/closed, so this needs both animation
    # frames x both click states (4 templates) rather than the 2 that
    # cover a simple clicked/unclicked icon like hotel_key.
    templates:
    - templates/icon_talking_scroll.png
    - templates/icon_talking_scroll_active.png
    - templates/icon_talking_scroll2.png
    - templates/icon_talking_scroll2_active.png
    match_threshold: 0.85
  teleport_scroll:
    templates:
    - templates/icon_teleport_scroll.png
    - templates/icon_teleport_scroll_active.png
    match_threshold: 0.85
  meditation:
    template: templates/icon_meditation.png
    match_threshold: 0.85
  heel:
    template: templates/icon_heel.png
    match_threshold: 0.85
  haste:
    template: templates/icon_haste.png
    match_threshold: 0.85  # placeholder, same default as the other icons -- not yet live-calibrated
  mana:
    template: templates/icon_mana.png
    match_threshold: 0.85

# World-space NPC/object sprites -- unlike icons (fixed UI position,
# always searched scoped to roi_skill), these render in the game world
# itself at whatever position the camera/character happen to be, so
# they're plain unscoped template matches over the whole frame (see
# pc/routine -- built for [1단계]/[3단계]'s "click the thing that looks
# like this" steps). Unlike text labels floating over an NPC's head,
# clicking the label doesn't reliably trigger interaction -- the sprite
# itself has to be clicked (confirmed live: clicking the "엔케" NPC's
# name-tag text only walked the character over without opening dialogue,
# clicking the sprite opened it immediately) -- so these exist
# specifically for that, not as a replacement for OCR-based text finding
# (pc/detector/chat_reader.py) which is still used for menu text.
npcs:
  event:
    template: templates/npc_event.png
    match_threshold: 0.85
  hotel_manager:
    template: templates/npc_hotel_manager.png
    # Measured 0.907-1.0 across several independent live frames (same
    # window, different camera/dialog states) during [1단계] development.
    match_threshold: 0.85
  teleport_gate:
    template: templates/npc_teleport_gate.png
    # The gate sometimes renders in a fainter/translucent state (unclear
    # exactly when -- possibly after it's already been used once) where
    # match score drops well below the 0.85 a freshly-rendered gate
    # scores. Measured true-location vs. a wrong-location score on two
    # independent live frames of the faint state: 0.427/0.304 (margin
    # 0.123) and 0.387/0.271 (margin 0.116) -- consistent enough to set
    # a threshold safely between the two clusters rather than the
    # fully-rendered 0.85.
    match_threshold: 0.35
    # If the full template is not found, also compare the visible part
    # of a gate clipped by the game-frame edges. Partial matching is
    # restricted to the four edges/corners to limit false positives.
    partial_match_threshold: 0.5
    partial_min_visible_fraction: 0.5
    partial_scan_step_px: 2

# Current location name (e.g. "오렌 마을", "버림받은 자들의 땅"), shown
# top-left of the character-stat panel -- only visible outdoors (indoors/
# in the hotel room, nothing renders there). The text itself changes with
# location, so -- same anchor+offset reasoning as hpmp_anchor/dialog --
# `template` is NOT the text but a small, unique, never-changing nearby
# landmark: the first stat-category icon (the circular frame right under
# the LEV bar). Measured a 1.0 (true location) vs 0.509 (a different
# stat icon on the same panel -- they share the same circular border
# style) margin across 3 independent live frames (2 indoor, 1 outdoor
# mid-combat), so 0.75 sits comfortably in between.
location:
  template: templates/roi_location_anchor.png
  match_threshold: 0.75
  content_offset: {left: -8, top: -92, width: 300, height: 40}
  # Fixed location labels use the game's tiny outlined font, which the
  # general Korean OCR model does not recognize reliably. Verify this
  # known destination visually inside content_offset instead.
  target_template: templates/location_wasteland.png
  target_match_threshold: 0.85
  verify_timeout_seconds: 6.0
  verify_interval_seconds: 0.5

# HP/MP trigger conditions. Each fires its `key` when the matching gauge
# is at or below `threshold_percent` -- but not more often than once per
# `cooldown_seconds`, even if the condition keeps holding true, so a
# sustained low-HP/MP state doesn't spam the same key every poll.
# HP and MP are independent: one being on cooldown never blocks the other.
conditions:
  hp_low:
    threshold_percent: 10.0
    cooldown_seconds: 600.0
    key: F12
  mp_low:
    threshold_percent: 10.0
    cooldown_seconds: 600.0
    key: F12

# Named action sequences: an ordered list of steps, run non-blocking
# with the given waits between them. A condition (above) can trigger one
# of these instead of a single key by adding `sequence: <name>` to it --
# e.g. `hp_low: {..., sequence: hp_low_example}` would run this whole
# sequence instead of just tapping `key`. Not turned on by default: the
# example below mirrors the spec's own sample (HP low -> move, click,
# then two key taps) but with placeholder mouse coordinates (0, 0) --
# adjust x/y to real screen positions (and actually add `sequence: ...`
# to a condition) before using it for real.
sequences:
  hp_low_example:
  - {type: MOUSE_MOVE, x: 0, y: 0}
  - {type: WAIT, ms: 30}
  - {type: MOUSE_CLICK, button: LEFT, hold_ms: 30}
  - {type: WAIT, ms: 50}
  - {type: KEY, key: F1, hold_ms: 30}
  - {type: WAIT, ms: 100}
  - {type: KEY, key: F2, hold_ms: 30}

# Generic dialog window -- the same frame (top-left of screen) is reused
# for many different popups: talking-scroll/teleport-scroll location
# lists, and (per the user) NPC dialogue too. Only the frame position is
# stable; the content inside changes per-dialog and while scrolling, so
# -- same reasoning as roi_skill/roi_buff -- matching the whole window
# image directly isn't reliable. It's worse than roi_skill/roi_buff,
# too: even with visually-identical list content, whole-image matching
# scored only ~0.30, because text edges are extremely sensitive to
# sub-pixel rendering differences between captures (confirmed via a
# pixel diff -- every letter's outline lit up despite the two images
# looking the same to the eye). `template` here is therefore NOT the
# full dialog capture (that's templates/roi_dialog.png, kept as a
# reference/for re-measuring content_offset, but not used for matching)
# -- it's just the "Close" button area, which is unique to the top
# border (unlike the rest of the border's rope pattern, which is
# ambiguous with the bottom border).
#
# This crop is taken from templates/roi_dialog.png itself (img[2:26,
# 369:439] -- tight around the gold border + "Close" text, minimal flat
# background margin) rather than from a live capture. An earlier looser
# crop of the same button (more surrounding black margin) scored 0.735
# true-location vs. 0.696 for a wrong location on a live frame -- a razor
# -thin, unsafe margin. Tracked that down to TM_CCOEFF_NORMED itself:
# normalized correlation gets numerically unstable over a near-flat,
# low-texture patch (the wrong-location match was plain dark background,
# mean brightness 42/255, std 13), so a crop that's mostly empty margin
# is fragile no matter what it's cropped from. Trimming the margin so
# the crop is mostly gold border + text fixed it: 0.857-1.0 true-location
# vs. 0.684 wrong-location across two independent live frames -- a much
# safer margin. match_threshold sits between those.
# `content_offset` is the OCR-able content area's position/size relative
# to the matched Close-button region's top-left corner, sized to cover
# the entire dialog content (not a conservative guess) per the user's
# request.
dialog:
  template: templates/roi_dialog_border.png
  match_threshold: 0.75
  content_offset: {left: -365, top: 35, width: 432, height: 535}

# Step 2 proceeds to Step 3 only when HP is 100% and MP reaches this level.
step2:
  mp_ready_percent: 97.0
  # When buff_event is absent before meditation, visit the Giran general
  # merchant, click npc_event, then restart Step 2. The routine GUI can
  # override this setting for the current run.
  event_recovery_enabled: true

# Safety handoff while moving to the hunting area. Step 3 is aborted
# immediately and Step 2 is forced even if MP is already full.
step3:
  hp_exit_percent: 50.0
  gate_miss_click_x_ratio: 0.50
  gate_miss_click_y_ratio: 0.20
  # Random upper-screen click range around the ratios above. Defaults yield
  # x=35~65% and y=15~25% of the game frame.
  gate_miss_click_x_jitter: 0.15
  gate_miss_click_y_jitter: 0.05

# Failed steps restart from the Step 2 entry precondition instead of terminating.
routine:
  restart_delay_seconds: 5.0
  # When enabled, a dungeon-time reading at or below this value pauses Step 3
  # until the randomized morning resume window. Disable it to keep running
  # Step 3 while still logging the reading and saving the low-time chat ROI.
  pause_on_low_dungeon_time: false
  minimum_dungeon_minutes_for_step3: 9
  # After Step 3 succeeds, teleport once before enabling ATS in Step 4.
  teleport_before_step4: false
  pre_step4_teleport_settle_seconds: 1.5
  # During Step 4, teleport when MP has not decreased for this many ticks.
  teleport_on_mp_stagnation: true
  mp_stagnant_ticks_before_teleport: 5

# Serial link to the Arduino. `port` is Windows-specific (COMxx) and
# changes on every upload/reset -- set it to "auto" (default) to have
# pc/serial/port_finder.py find the board automatically by its USB
# VID:PID (falls back to matching "Arduino" in the port description).
# Set it to a specific port (e.g. "COM19") instead if auto-detect ever
# picks the wrong device or can't find a clone board -- check Device
# Manager, or run:
#   python -c "import serial.tools.list_ports as lp; [print(p) for p in lp.comports()]"
serial:
  port: auto
  baud_rate: 115200

# User-editable macro definitions. The current development step only provides
# a GUI for editing/saving these values; no scheduler or HID execution path
# reads this section yet.
user_macros: []

# A condition selects one of the macros above by its stable id. Runtime
# execution is intentionally not implemented yet.
macro_conditions:
  hp_below:
    enabled: false
    threshold_percent: 70.0
    cooldown_seconds: 3.0
    macro_id: ""
